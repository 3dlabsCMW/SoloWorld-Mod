plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.saps.dev/releases' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        ftbofflinefarms {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Keep FTB Chunks APIs isolated in FTBChunksBridge.
    // Verify exact coordinates/version for your pack and update as needed.
    compileOnly 'dev.ftb.mods:ftb-chunks-neoforge:2101.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
